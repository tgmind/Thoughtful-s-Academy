[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/youtube-playlist"
  to = "/.netlify/functions/youtube-playlist"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "documentation/**,.env.example,tests/**"
  VITE_INSTITUTE_NAME = "GRAViTON PHYSICS"
  VITE_INSTITUTE_TAGLINE = "Learn. Grow. Succeed."

[context.production.environment]
  VITE_INSTITUTE_NAME = "GRAViTON PHYSICS"
  VITE_INSTITUTE_TAGLINE = "Learn. Grow. Succeed."

[context.deploy-preview.environment]
  VITE_INSTITUTE_NAME = "GRAViTON PHYSICS"
  VITE_INSTITUTE_TAGLINE = "Learn. Grow. Succeed."

[context.branch-deploy.environment]
  VITE_INSTITUTE_NAME = "GRAViTON PHYSICS"
  VITE_INSTITUTE_TAGLINE = "Learn. Grow. Succeed."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term immutable caching for fingerprinted assets (contains content hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache root route / SPA entrypoint
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service worker scripts must always revalidate for instant PWA updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/push-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest and Version metadata must always revalidate
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
